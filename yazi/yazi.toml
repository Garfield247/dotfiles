[mgr]
ratio = [1, 4, 3]
sort_by = "natural"
sort_sensitive = false
sort_dir_first = true
linemode = "size"
show_hidden = true
show_symlink = true
scrolloff = 8
title_format = "Yazi: {cwd}"

[preview]
wrap = "yes"
tab_size = 2
image_delay = 50
max_width = 1000
max_height = 1000

[input]
cursor_blink = false

[which]
sort_by = "key"
sort_sensitive = false
sort_reverse = false
