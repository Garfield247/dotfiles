[mgr]
prepend_keymap = [
  # Bookmarks
  { on = [ "g", "h" ], run = "cd ~", desc = "Go home" },
  { on = [ "g", "d" ], run = "cd ~/Downloads", desc = "Go downloads" },
  { on = [ "g", "D" ], run = "cd ~/Desktop", desc = "Go desktop" },
  { on = [ "g", "o" ], run = "cd ~/Documents", desc = "Go documents" },
  { on = [ "g", "p" ], run = "cd ~/Pictures", desc = "Go pictures" },
  { on = [ "g", "c" ], run = "cd ~/.config", desc = "Go config" },
  { on = [ "g", "G" ], run = "cd ~/Documents/go", desc = "Go Go workspace" },
  { on = [ "g", "t" ], run = "cd /private/tmp", desc = "Go temp" },

  # View modes
  { on = [ "z", "h" ], run = "hidden toggle", desc = "Toggle hidden files" },
  { on = [ "z", "n" ], run = "linemode none", desc = "Line mode: none" },
  { on = [ "z", "s" ], run = "linemode size", desc = "Line mode: size" },
  { on = [ "z", "m" ], run = "linemode mtime", desc = "Line mode: modified time" },
  { on = [ "z", "p" ], run = "linemode permissions", desc = "Line mode: permissions" },

  # Search
  { on = [ "s", "f" ], run = "search --via=fd", desc = "Search files by name" },
  { on = [ "s", "g" ], run = "search --via=rg", desc = "Search file contents" },
  { on = [ "s", "d" ], run = 'search_do --via=fd --args="-d 3"', desc = "Flat view, depth 3" },
  { on = "F", run = "plugin fzf", desc = "Jump with fzf" },

  # Shell and macOS integration
  { on = "<C-s>", run = 'shell "$SHELL" --block', desc = "Open shell here" },
  { on = "!", run = "shell --interactive", desc = "Run shell command" },
  { on = [ "o", "f" ], run = "shell -- open %s", desc = "Open with macOS" },
  { on = [ "o", "r" ], run = "shell -- open -R %h", desc = "Reveal hovered in Finder" },
  { on = [ "c", "p" ], run = "shell -- printf '%s' %h | pbcopy", desc = "Copy hovered path" },
  { on = [ "c", "d" ], run = "shell -- pwd | pbcopy", desc = "Copy current directory" },

  # Archive helpers
  { on = [ "x", "x" ], run = "plugin extract", desc = "Extract archive" },
  { on = [ "x", "z" ], run = "shell -- zip -r archive.zip %s", desc = "Zip selected files" },
]
