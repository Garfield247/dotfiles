# -----------------------------------------------------------------------------
# 终端能力
# -----------------------------------------------------------------------------

set -g default-terminal "tmux-256color"          # 使用 tmux-256color 替代 xterm-256color
set -g focus-events on                            # 启用 focus-events 配合 Neovim autoread
set -g terminal-features "xterm*:clipboard:ccolour:cstyle:focus:title,screen*:title,rxvt*:ignorefkeys,xterm-256color:RGB,tmux-256color:RGB,xterm-kitty:RGB" # 启用 24bit truecolor

# -----------------------------------------------------------------------------
# 基础行为
# -----------------------------------------------------------------------------

set -g mouse on                                  # 启用鼠标支持
set -g history-limit 50000                       # 历史缓冲区大小

set -g base-index 1                               # window 编号从 1 开始
setw -g pane-base-index 1                         # pane 编号从 1 开始
set -g renumber-windows on                        # 自动重新编号

# -----------------------------------------------------------------------------
# 窗口命名
# -----------------------------------------------------------------------------

setw -g automatic-rename on                       # 自动根据程序修改窗口名
set -g automatic-rename-format '#{b:pane_current_path}' # 显示当前目录名

# -----------------------------------------------------------------------------
# Window / Pane 创建
# -----------------------------------------------------------------------------

bind c new-window                                 # prefix + c 创建新 window

# -----------------------------------------------------------------------------
# 分屏保持路径
# -----------------------------------------------------------------------------

bind '"' split-window -c "#{pane_current_path}"   # 水平分屏
bind % split-window -h -c "#{pane_current_path}"  # 垂直分屏

# 额外快捷分割
bind - split-window -v -c "#{pane_current_path}"  # 横向分割
bind _ split-window -h -c "#{pane_current_path}"  # 纵向分割

# -----------------------------------------------------------------------------
# Vim 风格导航
# -----------------------------------------------------------------------------

bind -r h select-pane -L                          # 向左切 pane
bind -r j select-pane -D                          # 向下切 pane
bind -r k select-pane -U                          # 向上切 pane
bind -r l select-pane -R                          # 向右切 pane

# 交换 pane 位置
bind > swap-pane -D                               # 与下一个 pane 交换
bind < swap-pane -U                               # 与上一个 pane 交换

# -----------------------------------------------------------------------------
# Pane 调整大小
# -----------------------------------------------------------------------------

bind -r H resize-pane -L 2                        # 向左扩大 pane
bind -r J resize-pane -D 2                        # 向下扩大 pane
bind -r K resize-pane -U 2                        # 向上扩大 pane
bind -r L resize-pane -R 2                        # 向右扩大 pane

# -----------------------------------------------------------------------------
# Window 切换
# -----------------------------------------------------------------------------

unbind n                                          # 取消默认 next-window
unbind p                                          # 取消默认 previous-window

bind -r C-h previous-window                       # Ctrl+h 切换到前一个 window
bind -r C-l next-window                           # Ctrl+l 切换到下一个 window
bind Tab last-window                              # Tab 返回上一个 window

# yazi
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# -----------------------------------------------------------------------------
# 重新加载配置
# -----------------------------------------------------------------------------

bind r source-file ~/.tmux.conf \; display "Config Reloaded!" # reload config

# -----------------------------------------------------------------------------
# 插件列表
# -----------------------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'                 # 插件管理器
set -g @plugin 'tmux-plugins/tmux-sensible'       # tmux 默认合理配置
set -g @plugin 'dracula/tmux'                     # Dracula 主题

# -----------------------------------------------------------------------------
# Dracula 主题配置
# -----------------------------------------------------------------------------

set -g @dracula-show-powerline true               # 启用 powerline 风格分隔符
set -g @dracula-refresh-rate 10                   # 状态栏刷新时间

set -g @dracula-show-left-icon session            # 左侧显示 session icon

# 显示插件组件
set -g @dracula-plugins "cpu-usage ram-usage time"

# CPU / RAM
set -g @dracula-cpu-usage true                    # 显示 CPU 使用率
set -g @dracula-ram-usage true                    # 显示 RAM 使用率

# 时间
set -g @dracula-military-time true                # 24 小时制
set -g @dracula-day-month true                    # 显示日期

# 温度单位
set -g @dracula-show-fahrenheit false             # 使用摄氏度

# Git
set -g @dracula-show-flags true                   # 显示 git 状态标志

# 电池
set -g @dracula-show-battery true                 # 显示电池状态

# -----------------------------------------------------------------------------
# 初始化 TPM
# -----------------------------------------------------------------------------

run '~/.tmux/plugins/tpm/tpm'                     # 启动插件管理器
