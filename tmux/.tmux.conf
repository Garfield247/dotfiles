# ==============================================================================
#                      TMUX CONFIGURATION (.tmux.conf)
# ==============================================================================

# 确保子进程与 TPM 插件具备完整的命令查找路径 (兼容 Apple Silicon 与 Intel Mac)
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

# ------------------------------------------------------------------------------
# 1. General & Terminal Settings
# ------------------------------------------------------------------------------
# 256 color & 24-bit TrueColor support in iTerm2
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",*256col*:Tc"

# Faster command sequences (No delay for escape key in vim/nvim)
set -s escape-time 0

# Increase scrollback buffer size
set -g history-limit 50000

# Increase message display duration (2 seconds)
set -g display-time 2000

# Status bar update interval (seconds)
set -g status-interval 5

# Enable focus events for supported terminals
set -g focus-events on

# Super useful for multi-monitor setups
setw -g aggressive-resize on

# Enable passthrough for image preview (e.g. Yazi)
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# ------------------------------------------------------------------------------
# 2. Window & Pane Numbering
# ------------------------------------------------------------------------------
# Start index at 1 instead of 0 for easier keyboard reach
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows sequentially after any window is closed
set -g renumber-windows on

# ------------------------------------------------------------------------------
# 3. Prefix & Quick Reload
# ------------------------------------------------------------------------------
# Prefix key: Ctrl + b (Default)
set -g prefix C-b
bind C-b send-prefix

# Reload ~/.tmux.conf with <Prefix> + r
bind r source-file ~/.tmux.conf \; display-message " ✨ ~/.tmux.conf reloaded successfully!"

# ------------------------------------------------------------------------------
# 4. Mouse Support
# ------------------------------------------------------------------------------
# Enable mouse for scrolling, selecting panes/windows, and resizing panes
set -g mouse on

# ------------------------------------------------------------------------------
# 5. Split Window & Navigation
# ------------------------------------------------------------------------------
# Intuitive split commands (and keep current directory)
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Quick window switching
bind -n M-Left previous-window
bind -n M-Right next-window

# Vim-style pane resizing (repeatable with -r)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Maximize / Zoom current pane toggle
bind m resize-pane -Z

# ------------------------------------------------------------------------------
# 6. Copy Mode & macOS Clipboard (pbcopy)
# ------------------------------------------------------------------------------
setw -g mode-keys vi

# Use 'v' to begin selection, 'y' to copy to macOS clipboard
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send-keys -X cancel

# ------------------------------------------------------------------------------
# 7. Modern & Minimal Status Bar Styling
# ------------------------------------------------------------------------------
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Status bar left: Session name
set -g status-left-length 40
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold] ❐ #S #[bg=default,fg=default] "

# Status bar right: Date & Time
set -g status-right-length 100
set -g status-right "#[fg=#a6adc8] 📅 %Y-%m-%d #[fg=#89b4fa]|#[fg=#cdd6f4] ⏰ %H:%M #[bg=#313244,fg=#cdd6f4,bold] #h "

# Window status tabs
setw -g window-status-separator " "
setw -g window-status-format "#[bg=#313244,fg=#a6adc8] #I:#W "
setw -g window-status-current-format "#[bg=#a6e3a1,fg=#11111b,bold] #I:#W #[bg=default]"

# Pane border styling
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# ------------------------------------------------------------------------------
# 8. Tmux Plugin Manager (TPM) & Plugins
# ------------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect & Continuum options
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
